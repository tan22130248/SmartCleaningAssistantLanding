  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CleanBot AI - Dọn Dẹp Thông Minh, Sống Thảnh Thơi</title>
    <meta name="description" content="CleanBot AI — Robot hút bụi AI thế hệ mới. Tự động lập bản đồ, tránh vật cản và tự đổ rác. Không gian sạch thảnh thơi." />
    
    <!-- Performance optimizations -->
    <link rel="preload" href="/src/main.tsx" as="script">
    <link rel="modulepreload" href="/src/main.tsx">
    
    <!-- DNS Prefetch & Preconnect for external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://lh3.googleusercontent.com">
    <link rel="dns-prefetch" href="https://lh3.googleusercontent.com" />
    
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    
    <!-- Inline critical font declaration to avoid FOIT/FOUT -->
    <style>
      html { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; }
    </style>

    <!-- Inline theme script to prevent FOUC -->
    <script>
      (function(){
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>

    <!-- Open Graph / Facebook -->
